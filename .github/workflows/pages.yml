name: Browser demo
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'setuptools>=68' wheel
      - run: pip install -e '.[dev,browser]'
      - run: python tools/build_site.py
      - run: python -m playwright install --with-deps chromium
      - run: CRICKET_STATIC_TEST=1 pytest tests/test_static_site.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: browser-demo
          path: site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
